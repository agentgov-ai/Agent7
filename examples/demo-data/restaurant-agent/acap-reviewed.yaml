      value: true
      provenance: human_decision
      basis: Q5_approval_boundary
    condition: customer_confirmation
    note: approval.required is annotation-only; approval.granted is not derived from model-supplied tool arguments. Trusted
      approval must be established structurally by the reviewed ACAP and findings rules; see review question Q5
    policy:
      provenance: human_decision
      rules:
      - a place_order tool event must exist earlier in the same session
      - the confirmation must arrive in a later invoke turn (trusted human input 'yes'), not the same model turn as the proposal
      - the model-supplied tool argument response='yes' is NOT trusted approval evidence
      known_limitations:
      - R2 accepts any earlier-turn place_order in the session as satisfying the human-approval boundary regardless of item
        identity; a proposal for item A is not evidence that a human approved item B (see findings.json evidence_gaps)
