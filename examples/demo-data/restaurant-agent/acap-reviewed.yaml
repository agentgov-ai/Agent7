review_questions:
- id: Q1
  topic: intended_purpose
  question: 'What is this restaurant agent intended to do, and for whom? (Discovered capability: menu Q&A, order drafting,
    order confirmation to a staff-verification log, receipt display.)'
  fills:
  - system.purpose
  answered: true
  answer_ref: artifacts\governance\acap-human-answers.yaml
- id: Q2
  topic: accountable_owner
  question: Who is the accountable owner for this agent and its order log (name/role)?
  fills:
  - system.owner
  answered: true
  answer_ref: artifacts\governance\acap-human-answers.yaml
- id: Q3
  topic: allowed_actions
  question: Which discovered tools are ALLOWED in normal operation? (greet_customer, get_user_name, get_menu, place_order,
    confirm_order, show_receipt — all currently unresolved.)
  fills:
  - tools[*].authorization
  answered: true
  answer_ref: artifacts\governance\acap-human-answers.yaml
- id: Q4
  topic: prohibited_actions
  question: Which actions must be PROHIBITED (e.g., confirming an order the customer never proposed, adding unrequested items,
    any future payment/messaging capability)?
  fills:
  - tools[*].authorization
  - prohibited_actions
  answered: true
  answer_ref: artifacts\governance\acap-human-answers.yaml
- id: Q5
  topic: approval_requirements
  question: 'Should confirm_order require evidence of a prior place_order proposal AND an explicit customer ''yes'' turn in
    the same session before it may write, while all read-only/local-display tools require no approval? (Runtime evidence:
    event bef3e128-513d-4484-86d2-603c8916e220 shows confirm_order invoked with a model-supplied response=''yes'' argument
    and no prior place_order tool_start in the same trace. This occurred during the controlled adversarial test s5_adversarial
    — see artifacts/governance/scenarios/manifest.json — demonstrating the argument-derived approval signal is spoofable and
    must not be trusted.)'
  fills:
  - tools[confirm_order].approval
  answered: true
  answer_ref: artifacts\governance\acap-human-answers.yaml
- id: Q6
  topic: sensitive_data
  question: 'Which customer data may the agent process or store? (Currently observed: customer first name in-session [redacted
    in evidence], order items in a local log. No payment, contact-detail or address capability discovered.)'
  fills:
  - data_policy
  answered: true
  answer_ref: artifacts\governance\acap-human-answers.yaml
- id: Q7
  topic: reassessment_triggers
  question: Besides the defaults (tool added, model changed, prompt changed, approval logic changed, external API changed,
    incident), what business changes require reassessment (e.g., real payment integration, real customer data, non-local deployment)?
  fills:
  - reassess_when
  answered: true
  answer_ref: artifacts\governance\acap-human-answers.yaml
